<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JRF Expo 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --red: #FF0000;
  --red-deep: #C10000;
  --red-dim: #FFE3E0;
  --black: #0A0A0A;
  --white: #FFFFFF;
  --bg: #F1F0EC;
  --surface: #FFFFFF;
  --text: #0A0A0A;
  --text2: #7A776F;
  --text3: #ACA99F;
  --border: #E7E4DC;
  --nav-h: 78px;
  --hdr-h: 60px;
  --r: 22px;
  --r-sm: 14px;
  --r-lg: 30px;
  --pill: 999px;
  --sh: 0 1px 2px rgba(10,10,10,0.04);
  --sh-md: 0 8px 24px rgba(10,10,10,0.10);
  --f-head: 'Sora', -apple-system, sans-serif;
  --f-body: 'Inter', -apple-system, sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:var(--f-body);background:var(--bg);color:var(--text);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:430px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;transform:translateX(30px)}
.screen.active{opacity:1;pointer-events:all;transform:translateX(0)}
.screen.back{transform:translateX(-30px)}
.icon{display:inline-flex;flex-shrink:0}
.icon svg{display:block}

/* ── SCROLLABLE BODY ── */
.scroll-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + 12px)}

/* ── HEADER ── */
.hdr{height:var(--hdr-h);display:flex;align-items:center;padding:0 16px;gap:12px;background:var(--bg);color:var(--text);flex-shrink:0;position:relative;z-index:10}
.hdr-logo{font-family:var(--f-head);font-weight:800;font-size:19px;letter-spacing:-.5px;color:var(--text);flex:1}
.hdr-logo span{color:var(--red)}
.hdr-back{width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);border-radius:50%;background:var(--surface);box-shadow:var(--sh)}
.hdr-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;background:var(--black);color:#fff;font-size:14px;font-weight:800;font-family:var(--f-head)}
.hdr-title{font-family:var(--f-head);font-size:17px;font-weight:800;flex:1;text-align:center;color:var(--text)}

/* ── BOTTOM NAV (floating pill) ── */
#nav-wrap{position:absolute;left:0;right:0;bottom:0;z-index:50;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 60%,transparent)}
#nav{height:66px;background:var(--surface);border-radius:var(--pill);display:flex;align-items:stretch;box-shadow:0 10px 32px rgba(10,10,10,.16),0 2px 6px rgba(10,10,10,.08);border:1px solid rgba(10,10,10,.06)}
.nav-item{flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);position:relative}
.nav-item.active{color:var(--text)}
.nav-icon-wrap{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.nav-item.active .nav-icon-wrap{background:var(--red);color:#fff}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 22px;height:48px;border-radius:var(--pill);font-family:var(--f-body);font-size:15px;font-weight:700;cursor:pointer;border:none;transition:opacity .15s,transform .1s;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--black);color:#fff}
.btn-accent{background:var(--red);color:#fff}
.btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border)}
.btn-ghost{background:rgba(255,255,255,.16);color:#fff}
.btn-full{width:100%}
.btn-sm{height:38px;font-size:13px;padding:0 16px}

/* ── CARDS ── */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.card-pad{padding:18px}

/* ── BADGE (monochrome — fill = runner, outline = visitor) ── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--pill);font-size:12px;font-weight:800;letter-spacing:.2px}
.badge-runner{background:var(--black);color:#fff}
.badge-nonrunner{background:transparent;color:var(--text);border:1.5px solid var(--border)}
.badge-cat{background:var(--bg);color:var(--text2);font-size:11px;font-weight:700;padding:4px 11px;border-radius:var(--pill)}

/* ── SECTION TITLE ── */
.section-title{font-family:var(--f-head);font-size:20px;font-weight:800;letter-spacing:-.3px;color:var(--text);margin-bottom:12px}
.eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--red);margin-bottom:6px}

/* ── PILLS / FILTER ── */
.pill-row{display:flex;gap:8px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.pill-row::-webkit-scrollbar{display:none}
.pill{padding:8px 16px;border-radius:var(--pill);font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);white-space:nowrap;transition:all .15s;flex-shrink:0}
.pill.active{background:var(--black);color:#fff;border-color:var(--black)}

/* ── ACTIVITY / LIST ROW ── */
.act-card{display:flex;gap:14px;padding:16px 18px;background:var(--surface);border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;align-items:center}
.act-card:active{background:var(--bg)}
.act-card:last-child{border-bottom:none}
.act-time{font-family:var(--f-head);font-size:14px;font-weight:800;color:var(--red);min-width:52px}
.act-info{flex:1}
.act-name{font-family:var(--f-head);font-size:15px;font-weight:700;line-height:1.3}
.act-loc{font-size:12px;color:var(--text2);margin-top:3px}
.act-chevron{color:var(--text3);flex-shrink:0}

/* ── BRAND CARD (initials avatar, no emoji) ── */
.brand-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);cursor:pointer;overflow:hidden;transition:transform .15s}
.brand-card:active{transform:scale(.97)}
.brand-logo-wrap{height:76px;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.brand-avatar{width:44px;height:44px;border-radius:var(--r-sm);background:var(--black);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-head);font-weight:700;font-size:15px}
.brand-body{padding:12px 14px}
.brand-name{font-family:var(--f-head);font-size:15px;font-weight:700}
.brand-zone{font-size:11px;color:var(--text2);margin-top:4px}

/* ── STAMP ── */
.stamp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:18px}
.stamp-dot{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .2s;position:relative;color:var(--red)}
.stamp-dot.earned{background:#fff}
.stamp-dot.empty{background:rgba(255,255,255,.16);border:2px dashed rgba(255,255,255,.4)}
.stamp-dot.earned:active{transform:scale(1.1)}
.stamp-dot.milestone-dot.earned{box-shadow:0 0 0 3px var(--black)}
.milestone{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);border-radius:var(--r);margin-bottom:10px}
.milestone-num{width:42px;height:42px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--f-head);font-size:13px;font-weight:800;color:var(--text2);flex-shrink:0}
.milestone.reached .milestone-num{background:var(--red);color:#fff}
.milestone-info{flex:1}
.milestone-title{font-family:var(--f-head);font-size:14px;font-weight:700}
.milestone-sub{font-size:12px;color:var(--text2);margin-top:2px}
.milestone.redeemed{opacity:.45}

/* ── MAP (light floor plan, red = selected) ── */
#map-container{flex:1;position:relative;overflow:hidden;background:var(--bg)}
#expo-svg{width:100%;height:100%;cursor:pointer;display:block}
.map-zone{cursor:pointer;transition:transform .15s}
.map-zone:active{transform:scale(.97)}
.map-tooltip{position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:22px 22px 34px;box-shadow:0 -4px 24px rgba(0,0,0,.14);transform:translateY(100%);transition:transform .25s ease;z-index:20}
.map-tooltip.show{transform:translateY(0)}

/* ── AUTH ── */
.auth-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px 0;text-align:center}
.auth-logo{font-family:var(--f-head);font-size:44px;font-weight:800;color:#fff;letter-spacing:-2px;line-height:1}
.auth-logo span{color:var(--red)}
.auth-form{background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:30px 22px 8px;margin-top:32px}
.form-group{margin-bottom:14px}
.form-label{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:6px;display:block}
.form-input{width:100%;height:50px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--bg);padding:0 15px;font-size:15px;font-family:var(--f-body);color:var(--text);outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--red)}
.form-err{font-size:12px;color:var(--red);margin-top:4px;font-weight:600}
.auth-switch{text-align:center;font-size:14px;color:var(--text2);padding:16px 0 0}
.auth-switch a{color:var(--red);font-weight:800;cursor:pointer;text-decoration:none}
.auth-hint{background:var(--bg);border-radius:var(--r-sm);padding:12px 15px;margin-bottom:16px;font-size:12px;color:var(--text2);line-height:1.7}

/* ── HOME HERO ── */
.home-hero{background:var(--red);border-radius:var(--r-lg);margin:16px 18px 0;padding:22px 20px 24px;position:relative;overflow:hidden}
.home-greeting{font-size:13px;color:rgba(255,255,255,.75);margin-bottom:4px;font-weight:600}
.home-name{font-family:var(--f-head);font-size:24px;font-weight:800;color:#fff;letter-spacing:-.5px}
.qr-pill-btn{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.25);color:#fff;border:none;border-radius:var(--pill);padding:0 16px;height:40px;font-family:var(--f-body);font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0}
.stat-big{display:flex;align-items:baseline;gap:8px;margin-top:22px}
.stat-big-num{font-family:var(--f-head);font-size:52px;font-weight:800;color:#fff;line-height:.9;letter-spacing:-2px}
.stat-big-label{font-size:13px;color:rgba(255,255,255,.8);line-height:1.3;font-weight:600}
.now-card{background:rgba(255,255,255,.24);border-radius:var(--r);padding:16px;margin-top:16px}
.now-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.8);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.now-dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.now-title{font-family:var(--f-head);font-size:19px;font-weight:700;color:#fff;line-height:1.2}
.now-meta{font-size:12px;color:rgba(255,255,255,.75);margin-top:4px;font-weight:600}
.now-cta{margin-top:12px}
.upnext-card{background:rgba(0,0,0,.2);border-radius:var(--r);padding:14px 16px;margin-top:10px;display:flex;gap:14px;align-items:center;cursor:pointer}
.upnext-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.65);width:56px;flex-shrink:0}
.upnext-title{font-family:var(--f-head);font-size:15px;font-weight:700;color:#fff;line-height:1.2}
.upnext-meta{font-size:12px;color:rgba(255,255,255,.65);margin-top:3px;font-weight:600}

/* ── RACE PASS ── */
.qr-card{background:var(--surface);border-radius:var(--r);padding:20px;text-align:center;box-shadow:var(--sh)}
.qr-box{display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.qr-caption{font-size:12px;color:var(--text2)}
.stat-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-box{background:var(--bg);border-radius:var(--r-sm);padding:14px}
.stat-box-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:4px}
.stat-box-val{font-family:var(--f-head);font-size:20px;font-weight:800;color:var(--text)}
.pass-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:var(--r-sm);padding:14px;margin-top:10px}
.pass-row-label{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:700;font-size:14px}
.pass-row-val{font-family:var(--f-head);font-weight:800;font-size:15px}
.check-row{display:flex;align-items:center;gap:10px;padding:9px 0}
.check-mark{width:20px;height:20px;border-radius:6px;background:var(--red);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.check-label{font-size:14px;color:var(--text)}

/* ── BENTO QUICK ACCESS ── */
.bento-grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:96px;gap:12px;padding:18px}
.bento-tile{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .15s;position:relative;overflow:hidden}
.bento-tile:active{transform:scale(.97)}
.bento-tile.span2{grid-column:span 2}
.bento-tile.row2{grid-row:span 2}
.bento-label{font-family:var(--f-head);font-size:15px;font-weight:700;line-height:1.2}
.bento-sub{font-size:11px;font-weight:600;opacity:.7;margin-top:2px}
.bento-dark{background:var(--black);color:#fff}
.bento-light{background:var(--surface);color:var(--text);box-shadow:var(--sh)}
.bento-accent{background:var(--red);color:#fff}

/* ── DETAIL SCREENS ── */
.detail-hero{padding:24px 18px;background:var(--black);color:#fff;border-radius:0 0 var(--r-lg) var(--r-lg)}
.detail-category{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.55);margin-bottom:8px}
.detail-title{font-family:var(--f-head);font-size:26px;font-weight:800;line-height:1.15;margin-bottom:10px;letter-spacing:-.5px}
.detail-meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.detail-chip{background:rgba(255,255,255,.14);border-radius:var(--pill);padding:6px 12px;font-size:12px;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:6px;font-weight:600}
.detail-body{padding:18px}
.detail-section{margin-bottom:22px}
.detail-section-title{font-family:var(--f-head);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--text2);margin-bottom:10px}
.detail-desc{font-size:15px;line-height:1.65;color:var(--text)}
.offer-card{background:var(--red);border-radius:var(--r);padding:16px;color:#fff;margin-bottom:18px}
.offer-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;opacity:.8;margin-bottom:5px}
.offer-text{font-family:var(--f-head);font-size:16px;font-weight:700}

/* ── ADMIN ── */
.admin-tab-row{display:flex;overflow-x:auto;background:var(--bg);scrollbar-width:none;padding:8px 12px;gap:6px}
.admin-tab-row::-webkit-scrollbar{display:none}
.admin-tab{padding:9px 16px;font-size:13px;font-weight:700;color:var(--text2);cursor:pointer;white-space:nowrap;border-radius:var(--pill);transition:all .15s}
.admin-tab.active{color:#fff;background:var(--black)}
.admin-section{padding:18px}
.admin-row{background:var(--surface);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.admin-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.admin-item:last-child{border-bottom:none}
.admin-item-info{flex:1;min-width:0}
.admin-item-title{font-family:var(--f-head);font-size:14px;font-weight:700}
.admin-item-sub{font-size:12px;color:var(--text2);margin-top:2px}
.admin-actions{display:flex;gap:6px}
.admin-btn{padding:6px 12px;border-radius:var(--pill);font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.stat-val{font-family:var(--f-head);font-size:24px;font-weight:800}
.stat-label{font-size:12px;color:var(--text2);margin-top:3px;font-weight:600}
.stat-accent{border-top:4px solid var(--red)}
.stat-neutral{border-top:4px solid var(--black)}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.show{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:26px 22px 36px;width:100%;transform:translateY(100%);transition:transform .25s ease;max-height:85vh;overflow-y:auto}
.modal.show{transform:translateY(0)}
.modal-title{font-family:var(--f-head);font-size:19px;font-weight:800;margin-bottom:18px}
.modal-close{position:absolute;right:22px;top:26px;width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2)}

/* ── STAMP TOAST ── */
.stamp-toast{position:fixed;top:-80px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:13px 22px;border-radius:var(--pill);font-size:14px;font-weight:700;z-index:200;transition:top .35s ease;white-space:nowrap;box-shadow:var(--sh-md);display:flex;align-items:center;gap:8px}
.stamp-toast.show{top:16px}

/* ── BANNER CAROUSEL ── */
.carousel-wrap{position:relative;overflow:hidden;border-radius:var(--r);margin:0 18px 16px;box-shadow:var(--sh-md)}
.carousel-track{display:flex;transition:transform .45s cubic-bezier(.4,0,.2,1);will-change:transform;touch-action:pan-y}
.carousel-slide{flex-shrink:0;width:100%;aspect-ratio:16/9;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 22px;overflow:hidden;cursor:pointer}
.carousel-brand{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.75);margin-bottom:4px}
.carousel-title{font-family:var(--f-head);font-size:18px;font-weight:700;color:#fff;line-height:1.25;max-width:82%}
.carousel-cta{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:12px;font-weight:800;color:var(--black);background:#fff;border-radius:var(--pill);padding:5px 14px}
.carousel-dots{display:flex;gap:5px;justify-content:center;padding:8px 0 4px}
.carousel-dot{width:5px;height:5px;border-radius:50%;background:var(--border);transition:all .25s}
.carousel-dot.active{background:var(--red);width:16px;border-radius:3px}

/* ── PROFILE ── */
.profile-hero{background:var(--black);padding:36px 20px 26px;text-align:center;color:#fff;border-radius:0 0 var(--r-lg) var(--r-lg)}
.profile-avatar{width:76px;height:76px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--f-head);font-size:28px;font-weight:800;color:#fff;margin:0 auto 14px}
.profile-name{font-family:var(--f-head);font-size:21px;font-weight:800}
.profile-email{font-size:13px;opacity:.55;margin-top:4px}
.profile-badge-row{margin-top:14px;display:flex;justify-content:center}

/* ── CALENDAR DAY PICKER ── */
.day-picker{display:flex;gap:8px}
.day-pill{flex:1;text-align:center;padding:10px 4px;border-radius:16px;cursor:pointer;transition:all .15s}
.day-pill-dow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;opacity:.6;margin-bottom:4px}
.day-pill-num{font-family:var(--f-head);font-size:17px;font-weight:800}
</style>
</head>
<body>
<div id="app">
  <div id="screen-login" class="screen"></div>
  <div id="screen-register" class="screen"></div>
  <div id="screen-home" class="screen"></div>
  <div id="screen-schedule" class="screen"></div>

const S = {
  user: null,
  selectedDay: '22',
  brandFilter: 'all',
  brandSearch: '',
  adminTab: 'overview',
  activities: [],
  brands: [],
  stampRewards: [],
  transactions: [],
  users: [],

  init() {
    const raw = localStorage.getItem('jrf_state');
    if (raw) {
      try {
        const saved = JSON.parse(raw);
        this.user = saved.user || null;
        this.activities = saved.activities || DEFAULT_ACTIVITIES;
        this.brands = saved.brands || DEFAULT_BRANDS;
        this.stampRewards = saved.stampRewards || DEFAULT_STAMP_REWARDS;
        this.transactions = saved.transactions || DEMO_TRANSACTIONS;
        this.users = saved.users || [];
      } catch(e) { this.reset(); }
    } else {
      this.activities = [...DEFAULT_ACTIVITIES];
      this.brands = [...DEFAULT_BRANDS];
      this.stampRewards = [...DEFAULT_STAMP_REWARDS];
      this.transactions = [...DEMO_TRANSACTIONS];
      this.users = [];
    }
  },

  save() {
    localStorage.setItem('jrf_state', JSON.stringify({
      user: this.user,
      activities: this.activities,
      brands: this.brands,
      stampRewards: this.stampRewards,
      transactions: this.transactions,
      users: this.users,
    }));
  },

  reset() {
    this.activities = [...DEFAULT_ACTIVITIES];
    this.brands = [...DEFAULT_BRANDS];
    this.stampRewards = [...DEFAULT_STAMP_REWARDS];
    this.transactions = [...DEMO_TRANSACTIONS];
    this.users = [];
  },

  isRunner(email) { return RUNNER_EMAILS.includes(email.toLowerCase()); },
  isAdmin(email) { return ADMIN_EMAILS.includes(email.toLowerCase()); },
  getUserStamps() { return this.user ? (this.user.stamps || 0) : 0; },

  addStamp() {
    if (!this.user) return;
    this.user.stamps = (this.user.stamps || 0) + 1;
    this.save();
    showStampToast();
  },

  login(email, password, name) {
    const isRunner = this.isRunner(email);
    const isAdmin = this.isAdmin(email);
    const existing = this.users.find(u => u.email === email.toLowerCase());
    if (existing) {
      this.user = existing;
    } else {
      const newUser = {
        id: 'u' + Date.now(),
        name: name || email.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g, c=>c.toUpperCase()),
        email: email.toLowerCase(),
        isRunner,
        isAdmin,
        bib: isRunner ? String(1000 + Math.floor(Math.random()*8999)) : null,
        wave: isRunner ? 'Wave ' + (1 + Math.floor(Math.random()*8)) : null,
        stamps: isRunner ? 2 : 0,
        redeemedMilestones: [],
        joinedAt: new Date().toISOString()
      };
      this.users.push(newUser);
      this.user = newUser;
    }
    this.save();
  },

  logout() {
    this.user = null;
    this.save();
    navHistory = [];
    navigate('login');
  }
};

// ROUTER
// ══════════════════════════════════════════════════════
let currentRoute = 'login';
let currentRouteParams = {};
let navHistory = []; // [{route, params}]

function navigate(route, options = {}) {
  const isExplicit = options.params !== undefined || options._isBack;
  const routeParams = isExplicit ? (options.params || {}) : options;
  const prev = currentRoute;
  if (!options._isBack && !['login','register'].includes(prev)) {
    navHistory.push({route: prev, params: currentRouteParams});
    if (navHistory.length > 20) navHistory.shift();
  }
  currentRoute = route;
  currentRouteParams = routeParams;

  const screens = document.querySelectorAll('.screen');
  screens.forEach(s => {
    s.classList.remove('active','back');
    if (s.id === 'screen-' + prev && options._isBack) s.classList.add('back');
  });
  if (prev === 'home' && route !== 'home') clearInterval(_carouselTimer);

  const next = document.getElementById('screen-' + route);
  if (next) {
    next.innerHTML = renderScreen(route, routeParams);
    requestAnimationFrame(() => {
      next.classList.add('active');
      if (route === 'home') setTimeout(initCarousel, 80);
    });
  }
  const navWrap = document.getElementById('nav-wrap');
  const mainRoutes = ['home','schedule','brands','map','stamps'];
  if (mainRoutes.includes(route) && S.user) {
    navWrap.style.display = 'block';
    renderNav(route);
  } else {
    navWrap.style.display = 'none';
  }
}

function goBack() {
  if (navHistory.length === 0) { navigate('home'); return; }
  const prev = navHistory.pop();
  navigate(prev.route, {params: prev.params, _isBack: true});
}
function canGoBack() { return navHistory.length > 0; }

function backBtn(fallback) {
  const oc  = canGoBack() ? 'goBack()' : (fallback ? "navigate('" + fallback + "')" : '');
  const vis = (canGoBack() || fallback) ? 'visible' : 'hidden';
  return '<div class="hdr-back" onclick="' + oc + '" style="visibility:' + vis + '">' + icon('chevronLeft',20) + '</div>';
}

function renderNav(active) {
  const items = [
    {id:'home', ic:'home', label:'Home'},
    {id:'schedule', ic:'calendar', label:'Schedule'},
    {id:'brands', ic:'tag', label:'Brands'},
    {id:'map', ic:'compass', label:'Map'},
    {id:'stamps', ic:'award', label:'Stamps'},
  ];
  document.getElementById('nav').innerHTML = items.map(it => `
    <div class="nav-item ${active===it.id?'active':''}" onclick="navigate('${it.id}')">
      <div class="nav-icon-wrap">${icon(it.ic,22)}</div>
    </div>
  `).join('');
}

function renderScreen(route, params) {
  switch(route) {
    case 'login': return renderLogin();
    case 'register': return renderRegister();
    case 'home': return renderHome();
    case 'schedule': return renderSchedule();
    case 'activity': return renderActivity(params);
    case 'brands': return renderBrands();
    case 'brand': return renderBrand(params);
    case 'map': return renderMap(params);
    case 'stamps': return renderStamps();
    case 'profile': return renderProfile();
    case 'admin': return renderAdmin();
    case 'promotions': return renderPromotions();
    default: return renderHome();
  }
}

// ── STAMPS ──
function renderStamps() {
  const stamps = S.getUserStamps();
  const rewards = S.stampRewards;
  const redeemed = S.user.redeemedMilestones || [];
  const dots = Array.from({length:12},(_,i) => {
    const isMilestone = (i + 1) % 3 === 0;
    const isEarned    = i < stamps;
    const classes     = `stamp-dot ${isEarned ? 'earned' : 'empty'} ${isMilestone ? 'milestone-dot' : ''}`;
    return `<div class="${classes}">${isEarned ? (isMilestone ? icon('award',16) : icon('check',16)) : ''}</div>`;
  }).join('');
  return `
  <div class="hdr">
    ${backBtn('home')}
    <div class="hdr-title">My stamps</div>
    <div class="hdr-icon" onclick="navigate('profile')">${initialsOf(S.user.name)}</div>
  </div>
  <div class="scroll-body">
    <div style="background:var(--black);padding:24px 18px 22px;border-radius:0 0 var(--r-lg) var(--r-lg)">
      <div style="font-family:var(--f-head);font-size:24px;font-weight:800;color:#fff;margin-bottom:4px">My stamps</div>
      <div style="font-size:13px;color:rgba(255,255,255,.55);margin-bottom:16px">Collect stamps. Earn rewards.</div>
      <button class="btn btn-ghost btn-sm" onclick="showStampQR()" style="gap:8px">${icon('qr',15)} Show stamp QR</button>
    </div>
    <div style="margin:18px">
      <div class="card" style="background:var(--red)">
        <div style="padding:18px 18px 4px;display:flex;justify-content:space-between;align-items:center">
          <div style="font-size:13px;font-weight:700;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:.8px">Stamp card</div>
          <div style="font-family:var(--f-head);font-size:14px;font-weight:800;color:#fff">${stamps} / 12</div>
        </div>
        <div class="stamp-grid">${dots}</div>
        <div style="padding:0 18px 18px">
          <div style="background:rgba(255,255,255,.28);border-radius:99px;height:6px;overflow:hidden">
            <div style="background:var(--black);height:100%;width:${(stamps/12*100).toFixed(1)}%;border-radius:99px;transition:width .5s ease"></div>
          </div>
          <div style="font-size:12px;color:rgba(255,255,255,.8);margin-top:8px;text-align:center">${stamps >= 12 ? 'Complete — collect your grand reward' : `${12-stamps} more stamp${12-stamps!==1?'s':''} to grand reward`}</div>
        </div>
      </div>
    </div>
    <div style="margin:0 18px 18px">
      <div class="card card-pad" style="background:var(--red-dim)">
        <div style="font-family:var(--f-head);font-size:14px;font-weight:700;color:var(--red-deep);margin-bottom:8px">How to collect stamps</div>
        <div style="font-size:13px;color:var(--text2);line-height:1.7">
          Visit participating brands and complete eligible purchases to earn stamps. Show your stamp QR at the Stamp Redemption counter — staff will scan it to add your stamp.
        </div>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          <button class="btn btn-primary btn-sm" onclick="showStampQR()">Show stamp QR</button>
          <button class="btn btn-secondary btn-sm" onclick="navigate('map',{zone:'stamp-redemption'})">Find counter</button>
        </div>
      </div>
    </div>
    <div style="padding:0 18px 8px"><div class="section-title">Reward milestones</div></div>
    <div style="padding:0 18px 18px">
      ${rewards.map(r => {
        const isRedeemed = redeemed.includes(r.stamps);
        const isUnlocked = stamps >= r.stamps;
        let subText;
        if (isRedeemed) subText = 'Redeemed';
        else if (isUnlocked) subText = 'Unlocked — show QR to redeem';
        else subText = 'Collect ' + r.stamps + ' stamps to unlock';
        return `
        <div class="milestone ${isUnlocked&&!isRedeemed?'reached':''} ${isRedeemed?'redeemed':''}">
          <div class="milestone-num">${isUnlocked ? icon('check',16) : icon('lock',15)}</div>
          <div class="milestone-info">
            <div class="milestone-title">${r.reward}</div>
            <div class="milestone-sub">${subText}</div>
          </div>
          ${isUnlocked && !isRedeemed ? `<button class="btn btn-sm btn-primary" style="flex-shrink:0;font-size:11px;padding:0 12px;height:32px" onclick="showStampQR()">QR</button>` : ''}
        </div>`;
      }).join('')}
    </div>
    <div style="padding:0 18px 18px">
      <button class="btn btn-secondary btn-full btn-sm" onclick="S.addStamp();navigate('stamps')" ${stamps>=12?'disabled':''}>Demo: collect a stamp</button>
    </div>
  </div>`;
}

            <div class="admin-item-sub">${t.userEmail} · Rp ${t.amount.toLocaleString('id-ID')}</div>
            <div class="admin-item-sub">${new Date(t.time).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'})}</div>
          </div>
        </div>`).join('')}
      </div>
    </div>`;
  }

  return `
  <div class="hdr">
    <div class="hdr-back" onclick="goBack()">${icon('chevronLeft',20)}</div>
    <div class="hdr-title">Admin CMS</div>
    <div style="width:38px"></div>
  </div>
  <div class="admin-tab-row">
    ${tabs.map(t=>`<div class="admin-tab ${tab===t.id?'active':''}" onclick="S.adminTab='${t.id}';navigate('admin')">${t.label}</div>`).join('')}
  </div>
  <div class="scroll-body" style="padding-bottom:20px">${content}</div>`;
}

function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pwd = document.getElementById('login-pwd').value;
  const err = document.getElementById('login-err');
  if (!email) { err.textContent = 'Please enter your email'; return; }
  if (!pwd) { err.textContent = 'Please enter your password'; return; }
  S.login(email, pwd);
  navigate(S.user.isAdmin ? 'admin' : 'home');
}

function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pwd = document.getElementById('reg-pwd').value;
  const err = document.getElementById('reg-err');
  if (!name) { err.textContent = 'Please enter your name'; return; }
  if (!email || !email.includes('@')) { err.textContent = 'Please enter a valid email'; return; }
  if (pwd.length < 6) { err.textContent = 'Password must be at least 6 characters'; return; }
  S.login(email, pwd, name);
  navigate('home');
}

function showModal(title, body) {

// ══════════════════════════════════════════════════════
// BANNER CAROUSEL
// ══════════════════════════════════════════════════════
let _carouselTimer = null;
let _carouselIdx   = 0;
let _carouselTotal = SPONSOR_BANNERS.length;
let _touchStartX   = 0;

function initCarousel() {
  const track = document.getElementById('carousel-track');
  if (!track) return;
  _carouselIdx   = 0;
  _carouselTotal = SPONSOR_BANNERS.length;
  clearInterval(_carouselTimer);
  _carouselTimer = setInterval(() => carouselGo(_carouselIdx + 1), 4000);
  carouselRender();

  const wrap = document.getElementById('carousel-wrap');
  if (!wrap) return;
  wrap.addEventListener('touchstart', e => { _touchStartX = e.touches[0].clientX; }, {passive:true});
  wrap.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - _touchStartX;
    if (Math.abs(dx) > 40) carouselGo(_carouselIdx + (dx < 0 ? 1 : -1));
  }, {passive:true});
}

function carouselGo(idx) {
  _carouselIdx = ((idx % _carouselTotal) + _carouselTotal) % _carouselTotal;
  clearInterval(_carouselTimer);
  _carouselTimer = setInterval(() => carouselGo(_carouselIdx + 1), 4000);
  carouselRender();
}

function carouselRender() {
  const track = document.getElementById('carousel-track');
  if (track) track.style.transform = 'translateX(-' + (_carouselIdx * 100) + '%)';
  for (let i = 0; i < _carouselTotal; i++) {
    const dot = document.getElementById('cdot-' + i);
    if (dot) dot.className = 'carousel-dot' + (i === _carouselIdx ? ' active' : '');
  }
}

function renderQR(elId, data, size) {
  setTimeout(() => {
    const el = document.getElementById(elId);
    if (!el) return;
    el.innerHTML = '';
    if (typeof QRCode !== 'undefined') {
      new QRCode(el, {text: data, width: size, height: size, colorDark: '#0A0A0A', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M});
    } else {
      el.innerHTML = `<div style="width:${size}px;height:${size}px;background:var(--bg);border-radius:12px"></div>`;
    }
  }, 80);
}

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
function getCurrentActivity() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  const cur = h*60+m;
  const day = String(now.getDate());
  const acts = S.activities.filter(a=>a.date===day);
  return acts.find(a=>{
    const [ah,am] = a.time.split(':').map(Number);
    const start = ah*60+am;
    return cur >= start && cur < start+90;
  }) || (acts.length ? acts[0] : null);
}

function getNextActivity() {
  const now = new Date();
  const cur = now.getHours()*60+now.getMinutes();
  const day = String(now.getDate());
  const acts = S.activities.filter(a=>a.date===day);
  const next = acts.find(a=>{
    const [ah,am] = a.time.split(':').map(Number);
    return ah*60+am > cur+90;
  });
  return next || (acts.length > 1 ? acts[1] : null);
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 12) return 'morning';
  if (h < 17) return 'afternoon';
  return 'evening';
}

function escHtml(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
